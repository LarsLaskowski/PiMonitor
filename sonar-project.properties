sonar.projectKey=LarsLaskowski_PiMonitor
sonar.organization=networlddev


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=PiMonitor
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file.
sonar.sources=.

# Test files are colocated with the code they cover (see docs/TESTS.md); keep
# them registered as tests, not main sources, so they are not reported as
# uncovered production code.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,bin/**,dist/**

# Coverage is generated by `go test ./... -coverprofile=coverage.out` in the
# CI SonarQube job.
sonar.go.coverage.reportPaths=coverage.out

# The dashboard's vanilla JS/CSS/HTML assets (internal/web/assets) have no
# test framework and aren't covered by the Go coverage report above, so they
# always show 0% coverage. Excluding them from the coverage metric keeps New
# Code Coverage meaningful for the code that actually has tests (Go) instead
# of failing the quality gate on every frontend-only change. They stay in
# sonar.sources, so bugs, code smells, and vulnerabilities in them are still
# analyzed and reported.
sonar.coverage.exclusions=internal/web/assets/**
