version: "2"

linters:
  enable:
    # Stand-in for SonarQube go:S3776 (cognitive complexity above 15), so the finding shows up in the
    # analyzer gate instead of only after the pull request is open.
    - gocognit
  settings:
    gocognit:
      min-complexity: 15
  # gocognit also counts the bare `if err != nil` check, which SonarQube ignores. Where that alone pushes
  # an existing function over the limit, add a named exclusion here and record the reason in
  # `.squad/project.md` (*Analyzer exclusions*).
  exclusions:
    rules:
      # SonarQube analyzes test files as tests (sonar.test.inclusions) and reports go:S3776 on them; it reports
      # none for these two, which gocognit puts over 15 by counting error checks and nesting in t.Run closures.
      - path: internal/collector/disk_test\.go
        text: "cognitive complexity \\d+ of func `TestParseMounts_DecodesOctalEscapes`"
        linters: [gocognit]
      - path: internal/collector/temperature_test\.go
        text: "cognitive complexity \\d+ of func `TestParseVcgencmdTemp`"
        linters: [gocognit]
      # SonarQube reports no go:S3776 for these collectors (15 or less by its count); gocognit also counts
      # constructs SonarQube does not, such as error checks and nesting inside closures, which puts them over 15.
      - path: internal/collector/diskio\.go
        text: "cognitive complexity \\d+ of func `\\(\\*DiskIOCollector\\)\\.Collect`"
        linters: [gocognit]
      - path: internal/collector/network\.go
        text: "cognitive complexity \\d+ of func `\\(\\*NetworkCollector\\)\\.Collect`"
        linters: [gocognit]
      - path: internal/collector/pihole\.go
        text: "cognitive complexity \\d+ of func `\\(\\*PiholeCollector\\)\\.Collect`"
        linters: [gocognit]
      - path: internal/collector/process\.go
        text: "cognitive complexity \\d+ of func `\\(\\*ProcessCollector\\)\\.Collect`"
        linters: [gocognit]
