# Controls the notes GitHub generates for a release ("Generate release notes" on the release page).
# GitHub groups by pull request label only (not by title), so label the pull request before merging.
# Nothing else is excluded: a pull request without a known label (Dependabot's included) is listed under
# "Other changes".
# A pull request lands in the first category whose labels it carries, so the order matters.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: "Breaking changes"
      labels:
        - breaking-change
    - title: "Features"
      labels:
        - enhancement
        - feature
    - title: "Security fixes"
      labels:
        - security
    - title: "Bug fixes"
      labels:
        - bug
    - title: "Other changes"
      labels:
        - "*"
