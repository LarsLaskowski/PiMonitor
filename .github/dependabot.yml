version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current. Pinning to a SHA is only safe
  # if something moves the pin forward when the action publishes a fix.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      # The init and analyze steps of one workflow must run the same version,
      # otherwise CodeQL fails with a configuration error.
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
