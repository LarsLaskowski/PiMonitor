# Example PiMonitor configuration. Copy to /etc/pimonitor/config.yaml and
# adjust as needed. Any key you omit falls back to its built-in default -
# see internal/config/config.go for the full list of defaults.

# Address the web dashboard and REST API listen on.
listen_addr: ":8080"

# debug, info, warn, or error.
log_level: "info"

# Whether every HTTP request is logged as a debug-level "http request" line
# (method, path, status, duration). Defaults to true. Set to false to
# silence per-request logging entirely, e.g. on a busy Pi where every
# dashboard poll would otherwise add a debug line - request volume stays
# visible via GET /api/v1/serverstats regardless of this setting.
access_log_enabled: true

# How often live metrics (CPU, load average, temperature, hwmon sensors,
# memory/swap, disk, disk I/O, network, wireless) are sampled. At least 1 and at most
# 604800 (7 days).
poll_interval_seconds: 5

# How often available apt updates are checked. This only reads the
# existing apt cache (`apt-cache dumpavail`) - it never refreshes it.
# The cache itself is refreshed by the separate pimonitor-apt-update.timer
# systemd unit, which runs with root privileges. At least 1 and at most 10080 (7 days).
updates_check_minutes: 15

# How old the apt cache may be (in minutes) before the dashboard flags the
# update count as possibly stale. Should be a small multiple of the
# apt-update timer's interval (default: every 6 hours). At most 525600
# (365 days).
updates_stale_threshold_minutes: 720

# How much history to retain for sparklines, in minutes. At most 525600
# (365 days).
history_window_minutes: 60

# Whether to periodically snapshot metric history to disk so sparklines
# survive service restarts and reboots. History is flushed on the update
# check interval and on clean shutdown; on startup, points older than
# history_window_minutes are discarded.
history_persist_enabled: true

# Directory the history snapshot (history.bin) is written to. Must be
# writable by the service user; the systemd unit creates and allows
# /var/lib/pimonitor via StateDirectory=/ReadWritePaths=, so change both
# if you change this.
data_dir: "/var/lib/pimonitor"

# Whether to collect and display network interface throughput.
network_enabled: true

# Whether to enumerate hwmon temperature sensors (the SoC sensor plus any
# other exposed sensor: a PoE-HAT fan controller, an NVMe/SSD drive, an
# attached I2C/1-Wire sensor, ...), reported as the "sensors" array
# alongside the existing "temperature" field.
hwmon_enabled: true

# Whether to show the OS distribution / Raspberry Pi model in the
# dashboard.
distro_info_enabled: true
pi_model_enabled: true

# Whether the host name is read and shown in the dashboard and the API
# (system.hostname). The API needs no key unless api_key is set.
hostname_enabled: true

# Whether to expose GET /metrics: the current snapshot and the local openHAB status rendered in the
# Prometheus text exposition format, for a Prometheus server to scrape
# directly instead of polling GET /api/v1/metrics. Off by default - a
# distinct opt-in avoids confusion between this path and /api/v1/metrics.
# When api_key is set below, GET /metrics honours it exactly like every
# other endpoint, so enabling this does not bypass existing API
# authentication; configure the same value as a bearer_token/authorization
# header in your Prometheus scrape_config.
prometheus_enabled: false

# Whether to expose GET /api/v1/processes: the top-N running processes by
# CPU usage and by resident memory (RSS). Off by default - walking every
# /proc/<pid> entry is more invasive than the other metrics (it exposes
# what's running on the host, not just aggregate load), so this is a
# deliberate opt-in. Recomputed on the slow tick (updates_check_minutes),
# not poll_interval_seconds - see docs/API.md.
processes_enabled: false

# How many processes each ranking (CPU, memory) returns when
# processes_enabled is true. Must be between 1 and 100.
processes_top_n: 5

# Read-only status of an openHAB installation on this Pi, shown as a card
# on the dashboard and served by GET /api/v1/openhab (see docs/API.md).
openhab:
  # "auto" (default) polls only while openHAB is installed (one of
  # /usr/share/openhab, /etc/openhab, /var/lib/openhab exists) or its Java
  # process runs; "true" always polls; "false" turns the feature off, and
  # GET /api/v1/openhab then answers 404. With "true" and no openHAB on this
  # machine (and alerts on), the openhab_down alert fires and stays at crit.
  enabled: auto
  # openHAB's root URL. Must be http with a loopback host (127.0.0.0/8,
  # ::1 or localhost) and no path, query or user info: PiMonitor only ever
  # talks to the openHAB on this machine.
  base_url: "http://127.0.0.1:8080"
  # Optional openHAB API token. Without one, a default openHAB install
  # refuses system info, Things and add-ons (the card then reads "needs
  # api_token"). Set it here (this file is mode 640 root:pimonitor) or via
  # PIMONITOR_OPENHAB_TOKEN, which takes precedence. It is sent only to
  # base_url, and only to a server running as the owner of
  # /var/lib/openhab. With a token set, GET /api/v1/openhab serves Thing
  # names and statuses that openHAB shows only to authenticated users: set
  # api_key as well if the LAN should not read them.
  api_token: ""
  # Seconds between openHAB polls, 60 to 86400.
  poll_interval_seconds: 60
  # Hours of openHAB memory history (RSS, JVM heap, restarts) kept for the
  # dashboard chart and GET /api/v1/metrics/history, 1 to 168. Independent of
  # history_window_minutes.
  history_window_hours: 24

# If set, all /api/v1/... requests must include this value as either
# "Authorization: Bearer <api_key>" or "X-Api-Key: <api_key>". Leave empty
# (the default) to allow unauthenticated access on a trusted LAN. Set this
# before exposing the API to other systems (e.g. openHAB). The bundled web
# dashboard will prompt for this key once per browser and remember it in
# localStorage.
# Because this is a secret, install.sh keeps /etc/pimonitor/config.yaml
# readable only by root and the 'pimonitor' group (mode 640). If you copy
# the config manually, apply the same permissions:
#   sudo chown root:pimonitor /etc/pimonitor/config.yaml
#   sudo chmod 640 /etc/pimonitor/config.yaml
#
# Instead of setting it here you can export PIMONITOR_API_KEY, which takes
# precedence over this value; with systemd, point EnvironmentFile= at a file
# with the same restricted permissions. Do NOT use the -api-key flag outside
# local development: a process's command line is world-readable through
# /proc/<pid>/cmdline, so every local user could read the key.
api_key: ""

# Optional built-in HTTPS. When both tls_cert and tls_key are set, the
# server listens with HTTPS (std-lib ListenAndServeTLS) instead of plain
# HTTP - useful for a simple single-Pi setup that doesn't want to stand up
# a separate reverse proxy (nginx/Caddy) just for TLS termination. Leave
# both empty (the default) for plain HTTP. Setting only one of the two is
# a config error. Paths must be readable by the pimonitor service user.
#
# Two things to know before enabling this:
# - Privileged ports: pimonitor.service runs as the unprivileged 'pimonitor'
#   user with no CAP_NET_BIND_SERVICE, so listen_addr on a port below 1024
#   (e.g. ":443") will fail with "permission denied" - which, on this code
#   path, surfaces from ListenAndServeTLS and can look like a TLS problem
#   rather than a port problem. Keep listen_addr on a high port (the
#   default :8080 works fine over HTTPS too), or deliberately add
#   AmbientCapabilities=CAP_NET_BIND_SERVICE to the systemd unit - note
#   that this does widen the sandbox described in SECURITY.md.
# - Certificate renewal: the cert/key pair is read once at startup and
#   never again, so after a renewal (e.g. certbot) the service keeps
#   serving the expired certificate until it is restarted. Point your
#   renewal hook at `systemctl restart pimonitor`
#   (e.g. certbot --deploy-hook "systemctl restart pimonitor").
tls_cert: ""
tls_key: ""

# How old (in seconds) the latest collected snapshot may be before
# GET /healthz reports unhealthy (503) instead of 200 ok - catches a
# stalled collector goroutine that a plain liveness check would miss.
# 0 (the default) computes this automatically as 3x poll_interval_seconds
# plus a margin for the slowest a single healthy collection cycle may
# legitimately take (e.g. a hung vcgencmd call), so a slow-but-healthy
# tick isn't mistaken for a stalled collector. If set explicitly, it must
# be >= poll_interval_seconds, or /healthz would report unhealthy always.
# At most 31536000 (365 days).
healthz_max_staleness_seconds: 0

# Color-coding thresholds for the dashboard (and the load-average gauge
# scale, which uses the CPU thresholds relative to core count).
thresholds:
  temperature_warn_c: 60
  temperature_crit_c: 75
  cpu_warn_percent: 80
  cpu_crit_percent: 95
  disk_warn_percent: 80
  disk_crit_percent: 95
  swap_warn_percent: 50
  swap_crit_percent: 90
  memory_warn_percent: 80
  memory_crit_percent: 95
  # openHAB alert thresholds (they only act with openhab polling and
  # alerts on; the dashboard does not color by them). Unlike the thresholds
  # above, 0 turns a cutoff off; with both of a pair 0 the metric is not
  # alerted on. warn must be <= crit when both are non-zero.
  # Resident memory of the openHAB process, percent of the Pi's RAM.
  openhab_rss_warn_percent: 50
  openhab_rss_crit_percent: 75
  # Things that are not ONLINE (disabled ones left out). Counting Things
  # needs openhab.api_token (or PIMONITOR_OPENHAB_TOKEN); without a token
  # openHAB refuses the call and this rule is not evaluated. Whole numbers.
  openhab_things_offline_warn: 1
  openhab_things_offline_crit: 0

# Server-side threshold alert engine. On each poll it maps the current
# metrics against the thresholds above into per-metric alert states
# (ok/warn/crit) and a rolling list of fired/cleared transition events,
# exposed via GET /api/v1/alerts for third-party integrations.
alerts:
  # Whether the alert engine runs. When false, GET /api/v1/alerts reports
  # enabled=false with no states or events.
  enabled: true
  # Debounce window: a threshold crossing must persist for at least this
  # many seconds before it is reported as an alert, so short-lived spikes
  # (and momentary dips back to ok) don't flap. Set to 0 to fire on the
  # first crossing. At most 604800 (7 days).
  for_seconds: 30
  # Debounce window of the openHAB alerts (openhab_down, openhab_rss_percent,
  # openhab_things_offline), counted per openHAB poll, so keep it well above
  # openhab.poll_interval_seconds. 0 fires on the first poll. At most 604800 (7 days).
  openhab_for_seconds: 300

  # Optional HTTP webhooks. On every fired/cleared transition, PiMonitor
  # POSTs a JSON body to each webhook whose min_level the event reaches.
  # Delivery happens off the collection path, so a slow or failing webhook
  # never blocks metric collection. A single generic webhook covers Slack,
  # Discord, Home Assistant, ntfy, etc. via their incoming-webhook formats.
  # (No webhooks are configured by default.)
  webhooks: []
  #  - url: "https://hooks.example.com/pimonitor"
  #    # Only send events reaching at least this severity: "warn" (default,
  #    # every transition) or "crit".
  #    min_level: "warn"
  #    # Optional Go text/template rendered into the request body. When
  #    # omitted, a default JSON object describing the event is sent. The
  #    # template sees: .Metric, .Resource, .Kind ("fired"/"cleared"),
  #    # .From, .To, .Value, .At, .Message.
  #    #
  #    # When the body is JSON, wrap every interpolated value in the `json`
  #    # helper — it emits a correctly quoted and escaped JSON value, so a
  #    # mountpoint containing a quote or backslash cannot break the payload.
  #    # Note that `json` supplies the surrounding quotes itself, so it must
  #    # wrap the *entire* string value — combine literal text into the value
  #    # with `printf` rather than concatenating it around the action, e.g.
  #    # template: '{"text": {{json (printf "PiMonitor: %s" .Message)}}}'
  #    # Content-Type header (default "application/json"). Override it if a
  #    # custom template renders a non-JSON body, e.g. "text/plain".
  #    content_type: "application/json"
  #    # Per-attempt timeout in seconds (0 uses the built-in 10s default). At most 604800 (7 days).
  #    timeout_seconds: 10

  # How many times a failed webhook delivery is retried, with exponential
  # backoff, before it is given up on. 0 means a single attempt.
  notify_max_retries: 3
  # Base delay (seconds) before the first retry; it doubles each attempt. At most 604800 (7 days).
  notify_retry_backoff_seconds: 1
  # Rate limit, per metric and resource, per webhook: a "fired" event less
  # than this many seconds after the last delivered "fired" event of the
  # same metric and resource to the same webhook is dropped. "cleared"
  # (recovery) events are never rate-limited and end the window, so the
  # next "fired" event is always sent. 0 disables it. At most 604800 (7 days).
  notify_min_interval_seconds: 5
